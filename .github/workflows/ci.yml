name: CI - Build & Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # ===== Lấy mã nguồn =====
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ===== Cài đặt Docker Buildx =====
      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===== Build Docker image =====
      - name: Build image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          tags: milk_app:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== Chạy toàn bộ hệ thống bằng Docker Compose =====
      - name: Khởi động hệ thống (App, DB, Frontend)
        run: docker compose up -d app db frontend

      # ===== Đợi App sẵn sàng (Healthcheck) =====
      - name: Kiểm tra ứng dụng đã sẵn sàng
        run: |
          for i in {1..20}; do
            # Chúng ta dùng curl gọi port 8080 đã map ra localhost của Github Runner
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Hoàn tất: Ứng dụng đã sẵn sàng sau $i lần thử"
              exit 0
            fi
            echo "Đang chờ ứng dụng... (HTTP $STATUS)"
            sleep 3
          done
          echo "Lỗi: Ứng dụng không phản hồi (Timeout)"
          docker ps -a
          docker logs $(docker ps -qf "name=app")
          exit 1

      # ===== Khởi tạo Database =====
      - name: Thiết lập cơ sở dữ liệu
        run: |
          npm ci --prefix automation_test
          npm run reset --prefix automation_test
          npm run seed --prefix automation_test

      # ===== Chạy kiểm thử tự động Playwright =====
      - name: Automation testing - Playwright
        run: docker compose --profile test up --exit-code-from playwright

      - name: Lưu Report - Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation_test/playwright-report/
          retention-days: 30

      # ===== Debug nếu thất bại =====
      - name: Hiển thị Log nếu lỗi
        if: failure()
        run: |
          docker compose logs app
          docker compose logs playwright

      # ===== Dọn dẹp container =====
      - name: Dọn dẹp hệ thống
        if: always()
        run: docker compose down -v