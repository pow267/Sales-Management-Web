name: CI - Build & Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # ===== Lấy mã nguồn =====
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ===== Cài đặt Docker Buildx =====
      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===== Build Docker image =====
      - name: Build image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          tags: milk_app:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== Chạy toàn bộ hệ thống bằng Docker Compose =====
      - name: Khởi động hệ thống (App, DB, Frontend)
        run: docker compose up -d app db frontend

      # ===== Khởi tạo Database (Reset & Seed) =====
      - name: Thiết lập cơ sở dữ liệu
        run: |
          # Đợi hệ thống khởi động hoàn chỉnh
          sleep 10
          npm ci --prefix automation_test
          npm run reset --prefix automation_test
          npm run seed --prefix automation_test

      # ===== Chạy kiểm thử tự động Playwright bằng Docker Compose =====
      - name: Chạy kiểm thử tự động Playwright
        run: docker compose --profile test run --rm playwright

      - name: Lưu trữ báo cáo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation_test/playwright-report/
          retention-days: 30

      # ===== Dọn dẹp container =====
      - name: Dọn dẹp hệ thống
        if: always()
        run: docker compose down -v