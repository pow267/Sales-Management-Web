name: CI - Build & Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # ===== Lấy mã nguồn =====
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ===== Cài đặt Docker Buildx =====
      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===== Build Docker image =====
      - name: Build image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          tags: milk_app:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== Chạy container kiểm thử =====
      - name: Chạy container kiểm thử
        run: |
          docker run -d -p 8080:80 --name test_app milk_app:test

      # ===== Chờ ứng dụng khởi động =====
      - name: Kiểm tra ứng dụng đã sẵn sàng
        run: |
          for i in {1..20}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Ứng dụng đã sẵn sàng"
              exit 0
            fi
            echo "Đang chờ ứng dụng... lần $i"
            sleep 3
          done

          echo "Ứng dụng không khởi động được"
          docker logs test_app
          exit 1

      # ===== Hiển thị container (debug) =====
      - name: Hiển thị danh sách container
        run: docker ps -a

      # ===== Build Docker image cho Automation Test =====
      - name: Build image test Playwright
        working-directory: automation_test
        run: docker build -f Dockerfile.test -t test_playwright:latest .

      # ===== Chạy Test Container (Playwright) =====
      - name: Chạy kiểm thử tự động Playwright bằng Docker
        run: |
          docker run --rm \
            --network container:test_app \
            -v ${{ github.workspace }}/automation_test/playwright-report:/app/playwright-report \
            test_playwright:latest

      - name: Lưu trữ báo cáo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation_test/playwright-report/
          retention-days: 30

      # ===== Dọn dẹp container =====
      - name: Dọn dẹp container kiểm thử
        if: always()
        run: docker rm -f test_app || true